version: '3.8'

services:
  goshield:
    build: .
    container_name: goshield-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RATE_LIMIT=5.0
      - BURST_LIMIT=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
