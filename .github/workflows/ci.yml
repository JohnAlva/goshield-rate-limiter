name: GoShield CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Binary Verification
        run: CGO_ENABLED=0 go build -v -o /dev/null ./cmd/server
